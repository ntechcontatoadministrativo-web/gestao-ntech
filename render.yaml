# Blueprint do Render: New + > Blueprint > selecione este repositório.
# O banco é o Neon (DATABASE_URL / DIRECT_URL são pedidas na criação).
services:
  - type: web
    name: ntech-hub
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npx prisma db push --skip-generate && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ZAPI_INSTANCE_ID
        sync: false
      - key: ZAPI_TOKEN
        sync: false
      - key: ZAPI_CLIENT_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
